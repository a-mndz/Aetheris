[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Pure unit tests with no external state
    integration: Integration tests with component composition
    security: Security contract validation tests
    regression: Regression tests for previously fixed bugs
    slow: Tests that take >1s; excluded from default suite
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
addopts = -ra --strict-markers --tb=short
